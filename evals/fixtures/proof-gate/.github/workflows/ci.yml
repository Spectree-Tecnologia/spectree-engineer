name: ci
on:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=high
      - name: Unit and boundaries
        run: npm test
      - name: Playwright
        run: npx playwright test
