# One workflow, one job, never on push. GitHub bills a private repository per job (each one pays its own checkout,
# install, build and database, and its time is counted on its own), and a run on every push to main repeats what the
# pull request already proved on the merge commit. So: nothing runs on push, everything shares one runner, a pull
# request that only touches documentation stops after the secret scan, and the lockfile scanners run when the lockfile
# changed.
# What runs depends on the moment, from the cheapest and most frequent to the heaviest and rarest:
# - every push to a pull request, draft or not: the title, the scanners, the goal contract and its `in ci:` proofs,
#   the build and `npm test` (boundaries, type-check, unit tests). Minutes, the same in every pull request.
# - a pull request that is not a draft (opened ready, or marked "Ready for review"): also the backend e2e (the query
#   budget of rule 11) and, when the project has Playwright, its smoke: the specs of
#   apps/frontend/e2e/smoke.txt plus every spec the pull request adds or edits (the whole suite when it touches the
#   suite's harness). The merge gate.
# - every night on main (only when something merged in the last 26 h; otherwise the scanners alone) and on demand from
#   the Actions tab: everything, the whole Playwright suite and every route's latency budget, which reports (a warning
#   and a line in the run's summary) and never fails the run. A p95 on a shared 2-vCPU runner cannot say a change made
#   a route slow: on the pilot project the same route on the same code measured 1362 ms and 625 ms minutes apart.
# - before a release: on demand with stage `pre-release`, everything, and the latency budget fails the run.
# Never add a second job, a matrix or a `push:` trigger: extend the steps of this job. `npm run check:pr` runs the
# pull-request-only gates locally, before the PR exists.
name: CI

on:
  pull_request:
    # the default three, and the move from draft to ready, which runs the merge gate
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    # every night; the scope step makes it the scanners alone when nothing merged in the last 26 h
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'nightly: the latency budget reports. pre-release: the latency budget fails the run.'
        type: choice
        options:
          - nightly
          - pre-release
        default: nightly

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# read-only token: no step writes to the repository
permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # a hung job is billed until this limit
    timeout-minutes: 20
    defaults:
      run:
        # bash -eo pipefail: a failing command before a pipe fails the step
        shell: bash
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # empty outside a pull request; reaches the shell through env, never through ${{ }} inside run
      BASE_REF: ${{ github.base_ref }}
      # 'pre-release' makes the latency budget a gate; empty on a pull request and on the nightly schedule
      STAGE: ${{ inputs.stage }}
    steps:
      # squash merges carry the PR title into main's history. Read from the API, so a re-run sees a title fixed after the
      # first run. Fails in seconds, before anything is installed.
      - name: Conventional Commits title
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API_URL: ${{ github.event.pull_request.url }}
        run: |
          title=$(gh api "$PR_API_URL" --jq .title)
          pattern='^(feat|fix|chore|docs|refactor|test|build|ci|perf|style)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$title" =~ $pattern ]]; then
            echo "PR title must follow Conventional Commits, <type>(<scope>): <summary>. Got: $title"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # the secret scan reads the history; the diff against the base decides the rest
          fetch-depth: 0
          # nothing after the checkout talks to GitHub
          persist-credentials: false

      - name: What this run has to prove
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          lockfile=true
          migrations=
          # what a ready pull request runs of the Playwright suite: `full`, or the smoke plus the specs it wrote
          playwright=full
          if [ -n "$BASE_REF" ]; then
            changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
            grep -qvE '(\.md$|^docs/|^\.scratch/)' <<<"$changed" || code=false
            grep -qx 'package-lock.json' <<<"$changed" || lockfile=false
            deleted=$(git diff --name-only --diff-filter=D "origin/$BASE_REF...HEAD" -- apps/backend/prisma/migrations | grep '\.sql$' || true)
            if [ -n "$deleted" ]; then
              echo "this pull request deletes migrations; an applied migration is never deleted:"
              echo "$deleted"
              exit 1
            fi
            migrations=$(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- apps/backend/prisma/migrations | grep '\.sql$' | tr '\n' ' ' || true)
            # the suite's harness (its config, a helper, a fixture) changed: the whole suite; else the smoke and the
            # specs this pull request wrote. A name outside the pattern or a missing file fails here, named: the smoke
            # never shrinks by a typo
            harness=$(grep -E '^apps/frontend/(playwright\.config\.|e2e/)' <<<"$changed" | grep -vE '(\.spec\.ts$|^apps/frontend/e2e/smoke\.txt$)' || true)
            if [ -z "$harness" ] && [ -f apps/frontend/e2e/smoke.txt ]; then
              smoke=$(tr -d '\r' < apps/frontend/e2e/smoke.txt | sed 's/#.*//' | tr -s ' \t' '\n' | grep . || true)
              if [ -z "$smoke" ]; then
                echo "apps/frontend/e2e/smoke.txt lists no spec"
                exit 1
              fi
              written=$(git diff --name-only --diff-filter=d "origin/$BASE_REF...HEAD" -- 'apps/frontend/e2e/*.spec.ts' | sed 's#^apps/frontend/##' || true)
              playwright=$(printf '%s\n%s\n' "$smoke" "$written" | grep . | sort -u | tr '\n' ' ' || true)
              for spec in $playwright; do
                if [[ ! "$spec" =~ ^e2e/[A-Za-z0-9_.-]+\.spec\.ts$ ]] || [ ! -f "apps/frontend/$spec" ]; then
                  echo "refused Playwright spec: $spec (e2e/<name>.spec.ts, an existing file)"
                  exit 1
                fi
              done
            fi
          elif [ "$EVENT" = schedule ] && [ -z "$(git log -1 --since='26 hours ago' --format=%h)" ]; then
            # nothing merged since the last nightly run (26 h, not 24: a scheduled run can start late): only the
            # scanners have something new to say
            code=false
          fi
          echo "code=$code lockfile=$lockfile migrations=${migrations:-none}"
          echo "playwright=$playwright"
          {
            echo "code=$code"
            echo "lockfile=$lockfile"
            echo "migrations=$migrations"
            echo "playwright=$playwright"
          } >> "$GITHUB_OUTPUT"

      # .gitleaks.toml (default rules + narrow allowlists) and .gitleaksignore at the root list what was reviewed.
      # Image pinned by tag and digest; Dependabot does not track it: the platform-engineer bumps it with the stack review.
      - name: gitleaks (secrets in the git history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner /repo

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # the contract of the goal this pull request delivers: approved, every criterion's latest verdict met, or waived
      # by an amendment. No dependency needed; a pull request with no contract has nothing to check.
      - name: Goal contract
        if: github.event_name == 'pull_request'
        run: node scripts/goal.mjs check --ready --changed "origin/$BASE_REF"

      # npm reads the tree from package-lock.json: no install needed. osv-scanner.toml beside the lockfile lists the ids
      # ignored, each with a reason. Pin as above.
      - name: npm audit and osv-scanner (the lockfile against the advisory databases)
        if: steps.scope.outputs.lockfile == 'true'
        run: |
          npm audit --audit-level=high
          docker run --rm -v "$PWD:/repo" ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0 --lockfile=/repo/package-lock.json

      - name: squawk (the Postgres migrations this pull request adds)
        if: steps.scope.outputs.migrations != ''
        env:
          MIGRATIONS: ${{ steps.scope.outputs.migrations }}
        run: |
          # shellcheck disable=SC2086
          npx --yes squawk-cli@2.70.0 --assume-in-transaction $MIGRATIONS

      - if: steps.scope.outputs.code == 'true'
        run: npm ci

      # the same database as development: the backend's own compose file and the example env (test-only values; CI
      # never sees a real secret)
      - name: Postgres
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/backend
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres

      # before the seed: the backend prebuild generates the Prisma client the seed imports
      - if: steps.scope.outputs.code == 'true'
        run: npm run build

      - name: Migrations, runtime role and seed
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/backend
        run: |
          npx prisma migrate deploy
          npm run db:roles
          npx prisma db seed

      # boundaries, types and unit tests: none of them writes to the database
      - if: steps.scope.outputs.code == 'true'
        run: npm test

      # the p95 budget (rule 11) on a database nothing has written to yet, and with nothing else running on the runner.
      # Never on a pull request: every night and on demand, every route, and a red result is a warning and a line in the
      # run's summary, never a failed run; with stage pre-release, the gate before production, it fails the run. The
      # budgets in perf.config.json are the same in both: only whether a red result stops the run changes.
      - name: Latency budget
        if: steps.scope.outputs.code == 'true' && github.event_name != 'pull_request'
        run: |
          status=0
          npm run perf || status=$?
          if [ "$status" = 0 ]; then
            echo "### Latency budget: every route within budget" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$STAGE" = pre-release ]; then
            echo "::error title=Latency budget::npm run perf exited $status: the pre-release gate fails"
            echo "### Latency budget: over budget, the pre-release gate fails (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "::warning title=Latency budget::npm run perf exited $status (3: the machine was busy, nothing measured). Reported, not a failed run: a roadmap item, and a gate before the release."
          {
            echo "### Latency budget: over budget, reported (exit $status)"
            echo "The run does not fail on it. The table is in this step's log; the pre-release run is the gate."
          } >> "$GITHUB_STEP_SUMMARY"

      # the query budget of rule 11 lives here (expectQueryBudget): a ready pull request runs it, a draft does not
      - name: Backend e2e
        if: steps.scope.outputs.code == 'true' && github.event.pull_request.draft != true
        run: npm -w apps/backend run test:e2e

      # A proof the contract wrote as `in ci:` runs here, on the clean runner, and nowhere else: without this step a
      # green run would turn the criterion `met` without ever running it.
      - name: Goal proofs written in ci
        if: github.event_name == 'pull_request' && steps.scope.outputs.code == 'true'
        run: node scripts/goal.mjs prove --in-ci --changed "origin/$BASE_REF"

      # A Playwright suite goes here, as steps of this job (platform-engineer card): `docker compose down -v` and up
      # again for a database of its own, migrate, roles, seed, both servers, the browsers from the cache. Each of its
      # steps carries `github.event.pull_request.draft != true` in its `if:`, and the last runs what the scope chose,
      # with `SPECS: ${{ steps.scope.outputs.playwright }}` in its env:
      #   if [ "$SPECS" = full ]; then npx playwright test; else read -ra specs <<< "$SPECS"; npx playwright test "${specs[@]}"; fi
      # never with `--` before the names: Playwright drops every file filter after it and runs the whole suite.
